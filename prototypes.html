<!doctype html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  /* Mobile browsers scale a fixed-width viewport down to the screen natively and reliably.
     CSS `zoom` + `min-width:1000px` is flaky on them (window.innerWidth is mis-reported, so
     the whole 1000px design renders unscaled/overlapping). So on touch devices we hand the
     1000px design to the browser's own viewport scaling instead. Runs before layout to avoid
     a flash. Desktop keeps device-width (+ CSS zoom for narrow windows) and, in any case,
     desktop browsers ignore the viewport tag — so the windowed site is unaffected. */
  (function () {
    try {
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1000');
      }
    } catch (e) {}
  })();
</script>

      extend: {
        /* Force the md: breakpoint always-on so the desktop layout never reflows to its
           mobile fallback — below 1000px the whole page just scales down uniformly (zoom)
           instead of re-stacking, so nothing jumps. */
        screens: { md: '1px' },
        colors: {

  };
</script>

  /* Hamburger menu — shown when viewport is at or below the body's min-width */
  .nav-mobile-trigger {
    display: none;
    width: 38px; height: 38px;
    align-items: center; justify-content: center;
    border: 1.5px solid #ffffff;
    border-radius: 8px;
    background: transparent; color: #ffffff;

    box-shadow: 4px 4px 0 0 #ffffff;
    transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms cubic-bezier(.2,.8,.2,1);
  }
  .nav-mobile-trigger:hover { background: #EDE9E1; border-color: #3a3a3a; color: #000; transform: translateY(-1px); }
  .nav-mobile-trigger svg { display:block; }

  .nav-mobile-panel {
    display: none;
    position: fixed;
    top: 75px;
    right: 18px;

    border: 1.5px solid #ffffff;

  .nav-mobile-panel a {

    border: 1.5px solid transparent;
    text-decoration: none;

  }

  .nav-mobile-panel a.is-current { background: #ffffff; border-color: #324158; color: #324158; }

  @media (max-width: 1000px) {

<script>
  // Mobile nav (hamburger) toggle
  (() => {
    const btn = document.getElementById('nav-mobile-trigger');
    const panel = document.getElementById('nav-mobile-panel');
    if (!btn || !panel) return;
    function close(){ panel.classList.remove('is-open'); btn.setAttribute('aria-expanded','false'); }
    function open(){ panel.classList.add('is-open'); btn.setAttribute('aria-expanded','true'); }
    btn.addEventListener('click', e => {
      e.stopPropagation();
      panel.classList.contains('is-open') ? close() : open();
    });
    panel.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    document.addEventListener('click', e => {
      if (!panel.contains(e.target) && e.target !== btn) close();
    });
  })();

  // Below the design width (1000) the whole page scales down uniformly (CSS zoom):
  // everything shrinks together with the window, smoothly, with no reflow jumps.
  // (The md: breakpoint is forced always-on so the desktop layout never re-flows.)
  (() => {
    const DESIGN_WIDTH = 1000;
    const root = document.documentElement;
    let raf = 0;
    function applyScale() {
      const vw = window.innerWidth;
      if (vw < DESIGN_WIDTH) {
        root.style.setProperty('--page-scale', (vw / DESIGN_WIDTH).toString());
        document.body.classList.add('page-scaled');
      } else {
        root.style.removeProperty('--page-scale');
        document.body.classList.remove('page-scaled');
      }
    }
    function schedule() {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(applyScale);
    }
    window.addEventListener('resize', schedule);
    applyScale();
  })();
</script>
