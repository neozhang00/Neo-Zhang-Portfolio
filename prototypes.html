<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  /* Mobile browsers scale a fixed-width viewport down to the screen natively and reliably.
     CSS `zoom` + `min-width:1000px` is flaky on them (window.innerWidth is mis-reported, so
     the whole 1000px design renders unscaled/overlapping). So on touch devices we hand the
     1000px design to the browser's own viewport scaling instead. Runs before layout to avoid
     a flash. Desktop keeps device-width (+ CSS zoom for narrow windows) and, in any case,
     desktop browsers ignore the viewport tag — so the windowed site is unaffected. */
  (function () {
    try {
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1000');
      }
    } catch (e) {}
  })();
</script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        /* Force the md: breakpoint always-on so the desktop layout never reflows to its
           mobile fallback — below 1000px the whole page just scales down uniformly (zoom)
           instead of re-stacking, so nothing jumps. */
        screens: { md: '1px' },
        colors: {
          ink:    '#0c0c0d',
          cream:  '#ece6df',
          paper:  '#f4efe8',
          beat1:  '#fbc8c2',
          beat2:  '#f7d599',
          beat3:  '#f5c0db',
          beat4:  '#bfd9ec',
        },
        fontFamily: {
          display: ['Inter', 'system-ui', 'sans-serif'],
          body:    ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  /* Tungsten (licensed, brand_assets) — display font */
  @font-face {
    font-family: 'Tungsten';
    font-weight: 700;
    font-display: swap;
    src: url('brand_assets/Font/Tungsten-Font/WOFF2/Tungsten-Bold.woff2') format('woff2');
  }

  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #0c0c0d; background: #ece6df; -webkit-font-smoothing: antialiased; min-width: 1000px; }

  /* Below the design width (1000), JS sets --page-scale and adds .page-scaled.
     We use CSS zoom which scales both layout and visuals (so scrollbars/heights
     reflow to the scaled size, no horizontal scrollbar). */
  body.page-scaled { zoom: var(--page-scale, 1); }

  /* ButtonFormat_Header — nav buttons in the page header (#324158 bg) */
  .nav-pill {
    display:inline-flex; align-items:center; justify-content:center;
    height: 32px; padding: 0 22px;
    border: 1.5px solid #ffffff;
    border-radius: 8px;
    color: #ffffff; background: transparent;
    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700;
    letter-spacing: 0.16em; font-size: 11px;
    /* shadow cast at 135° (down-right), same color as border */
    box-shadow: 4px 4px 0 0 #ffffff;
    transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms cubic-bezier(.2,.8,.2,1);
  }
  .nav-pill:hover { background: #EDE9E1; border-color: #3a3a3a; color: #000000; transform: translateY(-1px); }
  .nav-pill:active { transform: translateY(0); }
  /* current page — filled pill (inverse of the outlined default) */
  .nav-pill.is-current { background: #ffffff; border-color: #324158; color: #324158; }

  /* header nav — text links sectioned off by divider lines (replaces the pills) */
  .nav-link {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px; padding: 0 26px;
    color: #ffffff;
    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700;
    letter-spacing: 0.16em; font-size: 12px;
    text-decoration: none;
    transition: color 180ms ease, transform 180ms cubic-bezier(.2,.8,.2,1);
  }
  .nav-link:hover, .nav-link:focus-visible { color: #EDE9E1; transform: translateY(-1px); text-decoration: underline; text-underline-offset: 5px; }
  .nav-link:active { transform: translateY(0); }
  .nav-link.is-current { color: #C4693B; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2.5px; }
  /* sub-pages carry a single back button instead of the section nav */
  .nav-back { gap: 10px; }
  .nav-back svg { flex: 0 0 auto; }


  .container-x { max-width: 1180px; margin-inline: auto; padding-inline: 24px; }
  .anchor { scroll-margin-top: 55px; }  /* land section top at the header's bottom edge (50px bar + 5px white line) */
  body { scroll-padding-top: 55px; }

  /* ===== Page transition curtain =====
     A Secondary-color panel sweeps left -> right to cover the window, five pack-colored
     dots orbit at the center while the next page loads, then the panel keeps travelling
     left -> right to uncover it. Sizing is percentage-based so the body's CSS zoom
     (narrow windows) still resolves to full-viewport coverage. */
  .curtain {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 200;
    background: #324158;
    display: flex; align-items: center; justify-content: center;
    transform: translateX(-100%);
    visibility: hidden;
    pointer-events: none;
    transition: transform 500ms cubic-bezier(.65, 0, .35, 1);
  }
  .curtain.is-covering { transform: translateX(0); visibility: visible; pointer-events: auto; }
  .curtain.is-leaving  { transform: translateX(100%); visibility: visible; pointer-events: auto; }
  /* outer wrapper carries the pop-in / shrink-out, inner wrapper carries the orbit */
  .curtain__loader {
    width: 86px; height: 86px;
    transform: scale(0); opacity: 0;
    transition: transform 280ms cubic-bezier(.2, .8, .3, 1.3), opacity 200ms ease;
  }
  .curtain.is-loading .curtain__loader { transform: scale(1); opacity: 1; }
  .curtain__orbit {
    position: relative; width: 100%; height: 100%;
    animation: curtain-orbit 1.3s linear infinite;
  }
  .curtain__dot {
    position: absolute; left: 50%; top: 50%;
    width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    border-radius: 50%;
    background: var(--dot, #EDE9E1);
    animation: curtain-dot 1.3s ease-in-out infinite;
  }
  /* five dots evenly spaced around a 34px radius, staggered opacity pulse.
     Colors are Magic's five mana identities: green, red, white, blue, black. */
  .curtain__dot:nth-child(1) { transform: rotate(0deg)   translateY(-34px); animation-delay: 0s; }
  .curtain__dot:nth-child(2) { transform: rotate(72deg)  translateY(-34px); animation-delay: 0.13s; }
  .curtain__dot:nth-child(3) { transform: rotate(144deg) translateY(-34px); animation-delay: 0.26s; }
  .curtain__dot:nth-child(4) { transform: rotate(216deg) translateY(-34px); animation-delay: 0.39s; }
  .curtain__dot:nth-child(5) { transform: rotate(288deg) translateY(-34px); animation-delay: 0.52s; }
  @keyframes curtain-orbit { to { transform: rotate(360deg); } }
  @keyframes curtain-dot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .curtain { transition: none; }
    .curtain__orbit, .curtain__dot { animation: none; }
  }
</style>
</head>

<script>
  // Below the design width (1000) the whole page scales down uniformly (CSS zoom):
  // everything shrinks together with the window, smoothly, with no reflow jumps.
  // (The md: breakpoint is forced always-on so the desktop layout never re-flows.)
  (() => {
    const DESIGN_WIDTH = 1000;
    const root = document.documentElement;
    let raf = 0;
    function applyScale() {
      const vw = window.innerWidth;
      if (vw < DESIGN_WIDTH) {
        root.style.setProperty('--page-scale', (vw / DESIGN_WIDTH).toString());
        document.body.classList.add('page-scaled');
      } else {
        root.style.removeProperty('--page-scale');
        document.body.classList.remove('page-scaled');
      }
    }
    function schedule() {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(applyScale);
    }
    window.addEventListener('resize', schedule);
    applyScale();
  })();
</script>


<!-- ============================ PAGE TRANSITION ============================ -->
<div class="curtain" id="page-curtain" aria-hidden="true">
  <div class="curtain__loader">
    <div class="curtain__orbit">
      <span class="curtain__dot" style="--dot: #9BD3AE;"></span>
      <span class="curtain__dot" style="--dot: #F9AA8F;"></span>
      <span class="curtain__dot" style="--dot: #FFFBD5;"></span>
      <span class="curtain__dot" style="--dot: #AAE0FA;"></span>
      <span class="curtain__dot" style="--dot: #CBC2BF;"></span>
    </div>
  </div>
</div>
<script>
  /* The curtain only ever moves left -> right: it sweeps IN over the outgoing page,
     holds while the next document loads, then sweeps OUT past the right edge.
     Covering is applied inline (before first paint) so the incoming page is hidden
     until its reveal runs; with JS off the element is never shown at all. */
  (() => {
    const curtain = document.getElementById('page-curtain');
    if (!curtain) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const COVER = 500, LOAD_IN = 280, HOLD = 420, SHRINK = 260, UNCOVER = 500;

    // --- entrance: this page arrived under the curtain, so uncover it ---
    curtain.classList.add('is-covering', 'is-loading');
    function reveal() {
      if (reduced) { curtain.classList.remove('is-covering', 'is-loading'); return; }
      setTimeout(() => {
        curtain.classList.remove('is-loading');                 // dots shrink away
        setTimeout(() => {
          curtain.classList.replace('is-covering', 'is-leaving'); // panel exits right
          setTimeout(() => curtain.classList.remove('is-leaving'), UNCOVER);
        }, SHRINK);
      }, HOLD);
    }
    if (document.readyState === 'complete') reveal();
    else window.addEventListener('load', reveal, { once: true });
    // returning via the back/forward cache: replay the reveal instead of staying covered
    window.addEventListener('pageshow', (e) => { if (e.persisted) { curtain.classList.add('is-covering', 'is-loading'); reveal(); } });

    // --- exit: intercept same-tab navigations to another page ---
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
      const url = new URL(a.getAttribute('href'), location.href);
      if (url.origin !== location.origin) return;
      if (url.pathname === location.pathname) return;            // same page (incl. #anchors)
      e.preventDefault();
      if (reduced) { location.href = url.href; return; }
      curtain.classList.add('is-covering');                      // panel sweeps in from the left
      setTimeout(() => curtain.classList.add('is-loading'), COVER);
      setTimeout(() => { location.href = url.href; }, COVER + LOAD_IN + HOLD);
    });
  })();
</script>
